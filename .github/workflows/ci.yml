name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Longer runs, in release mode, across seeds. Timing varies, so a seed doesn't replay exactly.
      - run: cargo build --release
      - run: for seed in 1 2 3 4 5; do ./target/release/tiny-kv-raft --seconds 15 --seed "$seed"; done
